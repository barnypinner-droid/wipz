name: Build Android APK

# Runs the exact same EAS build pipeline (native prebuild, config plugins,
# signing) as `eas build`, but compiles on this runner instead of Expo's
# cloud queue, so it doesn't touch the EAS Build monthly quota. Manual
# trigger only, run with: gh workflow run build-android.yml
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest runners ship with a full Android SDK preinstalled at
      # ANDROID_HOME already, the setup-android action tried to install an
      # extra legacy "tools" package on top of it that no longer exists
      # in the SDK repository, and just failed outright. Accepting
      # licenses on the SDK that's already there is all that's needed.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --local --non-interactive --output ./wipz.apk

      # Supabase Storage's free-tier plan caps individual files at 50MB,
      # well under this ~90MB APK, and that cap isn't something a bucket
      # setting can override. A GitHub Release asset has no such limit
      # (up to 2GB) and this repo is public, so the download link works
      # for anyone, no login needed, same as the old Expo dashboard link.
      - name: Publish APK to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view beta-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload beta-latest wipz.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create beta-latest wipz.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "Wipz Android Beta" \
              --notes "Automatically rebuilt by CI. Always the latest Android beta build."
          fi

      - name: Upload build log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wipz-apk
          path: apps/mobile/wipz.apk
          retention-days: 14
