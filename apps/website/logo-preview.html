<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wipz logo — Impact, single colour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      background: #0b0f19;
      font-family: -apple-system, sans-serif;
      padding: 40px;
    }
    .label {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .row {
      margin-bottom: 60px;
    }
    .logo {
      font-size: 120px;
      line-height: 1;
      color: #6366f1;
    }
    .impact { font-family: Impact, 'Anton', sans-serif; font-weight: bold; }
    .anton { font-family: 'Anton', sans-serif; }

    .nav {
      border-top: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 20px 40px;
      margin: 0 -40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav .logo { font-size: 32px; }
    .nav-cta {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 8px 16px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #06b6d4;
    }
  </style>
</head>
<body>
  <div class="row">
    <div class="label">1. Real Impact font (system), bold, indigo</div>
    <div class="logo impact">wipz</div>
  </div>
  <div class="row">
    <div class="label">2. Anton (free Impact-style Google Font, reliable on every device), indigo</div>
    <div class="logo anton">wipz</div>
  </div>
  <div class="label">Anton, at nav-bar size</div>
  <div class="nav">
    <span class="logo anton">wipz</span>
    <span class="nav-cta">Join the waitlist</span>
  </div>
</body>
</html>
